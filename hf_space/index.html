<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code Bug Detector</title>
  <style>
    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #090d16;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 30px 16px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(220, 38, 38, 0.18);
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(248, 113, 113, 0.25);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    select, input, textarea {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 14px;
      color: #f1f5f9;
      transition: all 0.2s;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }
    textarea {
      min-height: 180px;
      font-family: "JetBrains Mono", Consolas, Menlo, monospace;
      font-size: 13.5px;
      line-height: 1.5;
      resize: vertical;
    }
    .sample-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .sample-btn {
      background: none;
      border: 1px dashed var(--card-border);
      color: #fca5a5;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .sample-btn:hover {
      background: rgba(220, 38, 38, 0.15);
      border-color: #ef4444;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
      transition: all 0.2s;
    }
    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result-section {
      margin-top: 28px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .result-title {
      font-size: 14px;
      font-weight: 700;
      color: #f87171;
    }
    .btn-copy {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: #94a3b8;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-copy:hover {
      color: #fff;
    }
    .result-body {
      color: #e2e8f0;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">AI Code Diagnostics</span>
    <h1>🐛 Bug Detector</h1>
    <p class="subtitle">Paste your code to detect syntax errors, logical bugs, and get instant fixes with explanations.</p>

    <div class="grid-2">
      <div class="form-group">
        <label for="codeLang">Programming Language:</label>
        <select id="codeLang" onchange="loadSampleCode()">
          <option value="javascript">JavaScript / TypeScript</option>
          <option value="python">Python</option>
          <option value="cpp">C++</option>
          <option value="java">Java</option>
          <option value="c">C</option>
          <option value="sql">SQL</option>
        </select>
      </div>

      <div class="form-group">
        <label for="aiModel">Groq Model Engine:</label>
        <select id="aiModel">
          <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (Fastest Active)</option>
          <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (Meta Llama 3.1)</option>
          <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (High Capacity)</option>
          <option value="qwen/qwen3.8-27b">qwen/qwen3.8-27b (Multilingual)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="apiKey">Groq API Key:</label>
      <input type="password" id="apiKey" placeholder="gsk_..." />
    </div>

    <div class="form-group">
      <div class="sample-bar">
        <label for="codeSnippet" style="margin-bottom: 0;">Code Snippet:</label>
        <button type="button" class="sample-btn" onclick="loadSampleCode()">📋 Load Buggy Sample Code</button>
      </div>
      <textarea id="codeSnippet" placeholder="Paste your code snippet here..."></textarea>
    </div>

    <button id="runBtn" class="btn-submit" onclick="detectBugs()">
      <span>🔍 Detect Bugs & Fix Code</span>
    </button>

    <div id="resultSection" class="result-section">
      <div class="result-header">
        <span class="result-title" id="resultTitle">Bug Report & Fix</span>
        <button class="btn-copy" onclick="copyResult()">Copy Fix</button>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>
  </div>

  <script>
    const sampleBuggyCodes = {
      javascript: `async function fetchUserData(userId) {\n    // Bug: Missing await on fetch and json parsing\n    let res = fetch('https://api.example.com/user/' + userId);\n    let data = res.json();\n    return data.profile.name;\n}`,
      python: `def calculate_average(numbers):\n    total = 0\n    # Bug: Division by zero when empty list provided\n    for i in range(len(numbers)):\n        total += numbers[i]\n    return total / len(numbers)\n\nprint(calculate_average([]))`,
      cpp: `#include <iostream>\n\nint* createArray() {\n    // Bug: Returning pointer to local stack variable\n    int arr[5] = {1, 2, 3, 4, 5};\n    return arr;\n}\n\nint main() {\n    int* ptr = createArray();\n    std::cout << ptr[0] << std::endl;\n    return 0;\n}`,
      java: `public class StringUtils {\n    public static boolean isEqual(String s1, String s2) {\n        // Bug: Using == instead of .equals() for objects\n        return s1 == s2;\n    }\n}`,
      c: `#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char buffer[5];\n    // Bug: Buffer overflow vulnerability\n    strcpy(buffer, "ThisIsWayTooLong");\n    printf("%s\\n", buffer);\n    return 0;\n}`,
      sql: `SELECT users.id, users.name, orders.amount\nFROM users\n-- Bug: Missing JOIN condition causes Cartesian product\nJOIN orders\nWHERE orders.status = 'completed';`
    };

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('groq_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
      loadSampleCode();
    });

    function loadSampleCode() {
      const lang = document.getElementById('codeLang').value;
      document.getElementById('codeSnippet').value = sampleBuggyCodes[lang] || sampleBuggyCodes.javascript;
    }

    function copyResult() {
      const text = document.getElementById('resultBody').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("Bug report copied to clipboard!");
      });
    }

    async function detectBugs() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const lang = document.getElementById('codeLang').value;
      const model = document.getElementById('aiModel').value;
      const code = document.getElementById('codeSnippet').value.trim();

      const resultSection = document.getElementById('resultSection');
      const resultTitle = document.getElementById('resultTitle');
      const resultBody = document.getElementById('resultBody');
      const runBtn = document.getElementById('runBtn');

      if (!apiKey) {
        alert("Please enter your free Groq API key (starts with gsk_). Get one free at console.groq.com/keys");
        return;
      }

      if (!code) {
        alert("Please paste or write code to analyze.");
        return;
      }

      localStorage.setItem('groq_api_key', apiKey);

      resultSection.style.display = "block";
      resultTitle.innerText = "Analyzing Code for Bugs...";
      resultBody.innerText = "Scanning code with Groq " + model + "...";
      runBtn.disabled = true;

      const systemPrompt = `You are an expert Code Debugger and Software Engineer.
Analyze the provided ${lang} code:
1. 🐛 **Detected Bugs & Issues**: Clearly list each bug (syntax error, logic mistake, edge case like null/empty inputs, memory issue) and explain WHY it fails.
2. 🛠️ **Corrected Code**: Provide the clean, working, refactored ${lang} code.
3. 💡 **What Was Changed**: 1-2 sentence explanation of the solution.`;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: `Language: ${lang}\n\nCode snippet:\n${code}` }
            ],
            temperature: 0.1
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          resultBody.innerText = "API Error: " + (data.error?.message || response.statusText);
        } else if (data.choices && data.choices.length > 0) {
          resultTitle.innerText = "Bug Report & Solution";
          resultBody.innerText = data.choices[0].message.content;
        } else {
          resultBody.innerText = "Error: Unexpected response format.";
        }
      } catch (err) {
        resultBody.innerText = "Network Error: " + err.message;
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
